<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Learning Notes</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="LLM、Agent、模型训练与工程实践学习笔记">
  <meta name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">

  <!-- 与 hello-agents 同款主题：docsify vue.css -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@latest/lib/themes/vue.css">
  <!-- 侧边栏折叠（箭头样式） -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css">

  <style>
    /* ========== 暗黑模式（沿用 hello-agents 方案） ========== */
    :root {
      --dark-bg: #1a1a1a;
      --dark-text: #c4c4c4;
      --dark-sidebar: #141414;
      --dark-code-bg: #2b2b2b;
      --dark-border: #333;
      --theme-color: #42b983;
    }

    body.dark-mode {
      background-color: var(--dark-bg);
      color: var(--dark-text);
    }

    body.dark-mode .sidebar {
      background-color: var(--dark-sidebar);
      border-right: 1px solid var(--dark-border);
      color: var(--dark-text);
    }

    body.dark-mode .sidebar-nav li a {
      color: #999;
    }

    body.dark-mode .sidebar-nav li.active > a {
      color: var(--theme-color);
      border-right: 2px solid var(--theme-color);
    }

    body.dark-mode pre {
      background-color: var(--dark-code-bg) !important;
    }

    body.dark-mode code {
      background-color: var(--dark-code-bg) !important;
      color: #e0e0e0 !important;
    }

    body.dark-mode .markdown-section code {
      color: #f08d49;
      background-color: rgba(255, 255, 255, 0.1);
    }

    body.dark-mode h1, body.dark-mode h2, body.dark-mode h3, body.dark-mode h4 {
      color: #e0e0e0;
    }

    body.dark-mode blockquote {
      color: #999;
      background: rgba(255, 255, 255, 0.05);
      border-left-color: var(--theme-color);
    }

    body.dark-mode .markdown-section tr:nth-child(2n) {
      background-color: rgba(255, 255, 255, 0.03);
    }

    body.dark-mode .markdown-section td,
    body.dark-mode .markdown-section th {
      border-color: var(--dark-border);
    }

    body.dark-mode .mermaid {
      filter: invert(1) hue-rotate(180deg);
    }

    body.dark-mode .pagination-item-label,
    body.dark-mode .pagination-item-title {
      color: #999;
    }

    /* ========== 收紧正文纵向空隙 ========== */
    .markdown-section p,
    .markdown-section figure {
      margin: 0.85em 0;
    }

    .markdown-section blockquote {
      margin: 1em 0;
    }

    .markdown-section h1 {
      margin: 0 0 0.8rem;
    }

    .markdown-section h2 {
      margin: 26px 0 0.6rem;
    }

    .markdown-section h3 {
      margin: 22px 0 0.5rem;
    }

    .markdown-section h4 {
      margin: 18px 0 0.4rem;
    }

    .markdown-section hr {
      margin: 1.4em 0;
    }

    .markdown-section pre,
    .markdown-section output {
      margin: 0.9em 0;
    }

    .markdown-section p.tip {
      margin: 1em 0;
    }

    /* ========== 侧边栏主题切换按钮 ========== */
    .sidebar-toggle-btn {
      cursor: pointer;
      display: block;
      text-align: center;
      padding: 10px 0;
      margin: 0 15px 10px 15px;
      font-weight: bold;
      font-size: 14px;
      border-radius: 4px;
      background-color: rgba(0, 0, 0, 0.05);
      color: #505d6b;
      border: 1px solid rgba(0, 0, 0, 0.05);
      transition: all 0.3s;
    }

    body.dark-mode .sidebar-toggle-btn {
      background-color: rgba(255, 255, 255, 0.1);
      color: #ccc;
      border: 1px solid #444;
    }

    .sidebar-toggle-btn:hover {
      background-color: var(--theme-color);
      color: white;
    }

    /* 深色模式下修正 docsify 自带左下角汉堡按钮的浅色背景 */
    body.dark-mode .sidebar-toggle,
    body.dark-mode.close .sidebar-toggle {
      background-color: transparent;
    }

    /* ========== 侧边栏折叠样式优化 ========== */
    /* 折叠箭头：更大的圆角描边箭头，默认灰色，悬停/激活时变主题绿 */
    .sidebar-nav ul:not(.app-sub-sidebar) > li.folder::before {
      content: '';
      position: absolute;
      top: 11px;
      left: -12px;
      height: 8px;
      width: 8px;
      border-right: 2px solid #9aa7b5;
      border-bottom: 2px solid #9aa7b5;
      transform: rotate(-45deg);
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .sidebar-nav ul:not(.app-sub-sidebar) > li.folder.open::before {
      transform: rotate(45deg);
    }

    /* 分类标题：加粗，悬停变主题绿，带圆角高亮条 */
    .sidebar-nav li.folder {
      font-weight: 600;
      color: #2f3b45;
      transition: color 0.15s ease;
    }

    .sidebar-nav li.folder::after {
      content: '';
      position: absolute;
      top: 0;
      left: 6px;
      right: 6px;
      height: 30px;
      border-radius: 6px;
      background: transparent;
      transition: background-color 0.15s ease;
      pointer-events: none;
    }

    .sidebar-nav li.folder:hover {
      color: var(--theme-color);
    }

    .sidebar-nav li.folder:hover::after {
      background: rgba(66, 185, 131, 0.1);
    }

    .sidebar-nav ul:not(.app-sub-sidebar) > li.folder:hover::before,
    .sidebar-nav ul:not(.app-sub-sidebar) > li.folder.active::before,
    .sidebar-nav ul:not(.app-sub-sidebar) > li.folder:has(> ul li.active)::before {
      border-color: var(--theme-color);
    }

    .sidebar-nav li.folder.active {
      color: var(--theme-color);
    }

    .sidebar-nav li.folder.active::after {
      background: rgba(66, 185, 131, 0.12);
    }

    /* 当前页所在分类保持高亮（插件只标记 open，这里用 :has 补齐视觉状态） */
    .sidebar-nav li.folder:has(> ul li.active) {
      color: var(--theme-color);
    }

    .sidebar-nav li.folder:has(> ul li.active)::after {
      background: rgba(66, 185, 131, 0.12);
    }

    .sidebar-nav li.file a {
      transition: color 0.15s ease;
    }

    .sidebar-nav li.file a:hover {
      color: var(--theme-color);
    }

    /* 子列表：缩进引导线 + 平滑展开/收起动画 */
    .sidebar-nav li.folder > ul:not(.app-sub-sidebar) {
      display: block !important;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      padding-left: 10px;
      border-left: 1px solid rgba(125, 140, 155, 0.25);
      transition: max-height 0.28s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.22s ease;
    }

    .sidebar-nav li.folder.open > ul:not(.app-sub-sidebar),
    .sidebar-nav li.folder.active:not(.collapse) > ul:not(.app-sub-sidebar) {
      max-height: 260px;
      opacity: 1;
    }

    /* 深色模式适配 */
    body.dark-mode .sidebar-nav li.folder {
      color: #d6d6d6;
    }

    body.dark-mode .sidebar-nav li.folder:hover {
      color: var(--theme-color);
    }

    body.dark-mode .sidebar-nav li.folder::before {
      border-color: #8a96a3;
    }

    body.dark-mode .sidebar-nav ul:not(.app-sub-sidebar) > li.folder:hover::before,
    body.dark-mode .sidebar-nav ul:not(.app-sub-sidebar) > li.folder.active::before,
    body.dark-mode .sidebar-nav ul:not(.app-sub-sidebar) > li.folder:has(> ul li.active)::before {
      border-color: var(--theme-color);
    }

    body.dark-mode .sidebar-nav li.folder:hover::after {
      background: rgba(255, 255, 255, 0.07);
    }

    body.dark-mode .sidebar-nav li.folder.active::after {
      background: rgba(66, 185, 131, 0.16);
    }

    body.dark-mode .sidebar-nav li.folder:has(> ul li.active) {
      color: var(--theme-color);
    }

    body.dark-mode .sidebar-nav li.folder:has(> ul li.active)::after {
      background: rgba(66, 185, 131, 0.16);
    }

    body.dark-mode .sidebar-nav li.folder > ul {
      border-left-color: rgba(255, 255, 255, 0.14);
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script src="//cdn.jsdelivr.net/npm/mermaid@8.0.0-rc.8/dist/mermaid.min.js"></script>

  <script>
    window.$docsify = {
      name: 'Learning Notes',
      repo: 'https://github.com/qwerty3564/learning-notes',
      loadSidebar: true,
      auto2top: true,
      subMaxLevel: 3,
      sidebarDisplayLevel: 2,

      pagination: {
        previousText: '上一篇',
        nextText: '下一篇'
      },

      count: {
        countable: true,
        fontsize: '0.9em',
        color: 'rgb(90,90,90)',
        language: 'chinese'
      },

      plugins: [
        // 侧边栏暗黑模式切换按钮
        function (hook) {
          hook.doneEach(function () {
            const sidebar = document.querySelector('.sidebar-nav');
            if (!sidebar || document.querySelector('.sidebar-toggle-btn')) return;

            const btn = document.createElement('div');
            btn.className = 'sidebar-toggle-btn';

            const savedTheme = localStorage.getItem('theme-mode');
            if (savedTheme === 'dark') {
              document.body.classList.add('dark-mode');
              btn.textContent = '🌙 切换浅色模式';
            } else {
              btn.textContent = '☀️ 切换深色模式';
            }

            btn.onclick = function () {
              document.body.classList.toggle('dark-mode');
              const isDark = document.body.classList.contains('dark-mode');
              localStorage.setItem('theme-mode', isDark ? 'dark' : 'light');
              btn.textContent = isDark ? '🌙 切换浅色模式' : '☀️ 切换深色模式';
            };

            sidebar.insertBefore(btn, sidebar.firstChild);
          });
        },

        // Mermaid 图表渲染（代码块语言为 mermaid 时）
        function (hook) {
          hook.doneEach(function () {
            document.querySelectorAll('pre code.language-mermaid').forEach(function (block) {
              const pre = block.parentElement;
              if (pre.getAttribute('data-rendered')) return;
              pre.setAttribute('data-rendered', 'true');

              const div = document.createElement('div');
              div.className = 'mermaid';
              div.textContent = block.textContent;
              pre.replaceWith(div);

              try {
                mermaid.initialize({ startOnLoad: false });
                mermaid.init(undefined, div);
              } catch (e) { /* 渲染失败时保持原样 */ }
            });
          });
        }
      ]
    };
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@latest/lib/docsify.min.js"></script>

  <!-- 侧边栏折叠 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>

  <!-- 代码高亮 -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@latest/components/prism-bash.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@latest/components/prism-python.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@latest/components/prism-json.js"></script>

  <!-- 上一篇 / 下一篇 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@latest/dist/docsify-pagination.min.js"></script>

  <!-- 代码复制 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code"></script>

  <!-- 图片点击放大 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>

  <!-- KaTeX 公式渲染 -->
  <script src="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@3"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>

  <!-- 字数统计 -->
  <script src="//unpkg.com/docsify-count/dist/countable.js"></script>
</body>
</html>
